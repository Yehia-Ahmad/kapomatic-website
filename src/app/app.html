<div [style.--main-color]="generalSettings.settings().mainColor">

  @if (whatsappHref()) {
    <a
      class="whatsapp-float"
      [href]="whatsappHref()"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="تواصل عبر واتساب"

      <i class="fa-brands fa-whatsapp" aria-hidden="true"></i>

  }
</div>
