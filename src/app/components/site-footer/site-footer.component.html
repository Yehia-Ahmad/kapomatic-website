<footer class="border-t border-line-200 bg-surface-0">
  <div class="mx-auto px-4 py-2">
    <div class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
      <div class="flex flex-wrap items-center justify-center gap-3 sm:justify-start">
        @for (social of generalSettings.settings().socialMediaLinks; track social.name + social.link) {
          <a
            class="inline-flex h-10 w-10 items-center justify-center rounded-full border border-line-200 bg-surface-0 text-ink-700 transition hover:-translate-y-0.5 hover:text-ink-900 hover:shadow-sm focus:outline-none focus:ring-2"
            [style.--tw-ring-color]="generalSettings.settings().mainColor"
            [href]="social.link"
            target="_blank"
            rel="noopener noreferrer"
            [attr.aria-label]="social.name"
            [title]="social.name"
          >
            <i [class]="generalSettings.socialIcon(social.name)" aria-hidden="true"></i>
          </a>
        }
      </div>

      <nav class="flex flex-wrap items-center justify-center gap-x-6 gap-y-2 text-sm text-ink-700" aria-label="روابط التذييل">
        <a class="hover:text-ink-900" routerLink="/locations">أين تجدنا</a>
      </nav>
    </div>
    <div class="mt-2 text-center text-xs text-ink-500">Copyright 2026 — All rights reserved ©</div>
  </div>
</footer>
